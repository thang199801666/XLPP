[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
# Smoke test: install the wheel, build a workbook in memory and round-trip it.
test-command = "python -c \"import xlpp; wb=xlpp.Workbook(); ws=wb.add_worksheet('CI'); ws['A1'].value=42; wb.save('ci.xlsx'); wb2=xlpp.Workbook(); wb2.load('ci.xlsx'); assert wb2['CI']['A1'].value == 42.0; print('wheel OK')\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]
skip = "cp38-* cp39-*"
# std::filesystem requires macOS 10.15+; cibuildwheel defaults to 10.9.
environment = "MACOSX_DEPLOYMENT_TARGET=10.15"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
