name: C# CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-pack:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 zlib1g-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      - name: Configure (Windows, VS generator)
        if: runner.os == 'Windows'
        run: cmake -S . -B build-capi -G "Visual Studio 18 2026" -A x64 -DXLPP_BUILD_TESTS=OFF -DXLPP_BUILD_SAMPLES=OFF -DXLPP_BUILD_CAPI=ON -DXLPP_USE_BUNDLED_ZLIB=ON

      - name: Configure (Linux/macOS, Ninja)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build-capi -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXLPP_BUILD_TESTS=OFF -DXLPP_BUILD_SAMPLES=OFF \
            -DXLPP_BUILD_CAPI=ON -DXLPP_USE_BUNDLED_ZLIB=ON

      - name: Build native C API library
        run: cmake --build build-capi --config Release -j 4

      - name: Stage native library for the runtimes folder
        shell: bash
        run: |
          native=$(find build-capi -name 'xlpp_capi.dll' -o -name 'libxlpp_capi.so' -o -name 'libxlpp_capi.dylib' | head -n1)
          test -n "$native"
          mkdir -p "bindings/csharp/runtimes/${{ matrix.rid }}/native"
          cp "$native" "bindings/csharp/runtimes/${{ matrix.rid }}/native/"
          ls -la "bindings/csharp/runtimes/${{ matrix.rid }}/native/"

      - name: Run C# tests
        run: dotnet test bindings/csharp/tests/XlppNet.Tests/XlppNet.Tests.csproj -c Release

      - name: Pack NuGet
        run: dotnet pack bindings/csharp/XlppNet.csproj -c Release -o nuget-out

      - uses: actions/upload-artifact@v4
        with:
          name: xlpp-nuget-${{ matrix.os }}
          path: nuget-out/*.nupkg
