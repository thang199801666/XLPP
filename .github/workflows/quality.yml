name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fuzz-test:
    name: Fuzz Test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg (zlib)
        run: |
          vcpkg install zlib:x64-windows
          vcpkg integrate install

      - name: Build Debug
        run: msbuild XL++.sln /p:Configuration=Debug /p:Platform=x64 /m /verbosity:minimal

      - name: Run Fuzz Tests
        run: |
          $testOutput = & .\x64\Debug\XLPP.UnitTests.exe 2>&1
          $failCount = ($testOutput | Select-String -Pattern '\[FAIL').Count
          $passCount = ($testOutput | Select-String -Pattern '\[PASS').Count
          Write-Output "Passed: $passCount, Failed: $failCount"
          if ($failCount -gt 2) {  # Allow 2 pre-existing failures
            Write-Error "Too many test failures: $failCount"
            exit 1
          }
        continue-on-error: false

  static-analysis:
    name: MSVC /W4
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg (zlib)
        run: |
          vcpkg install zlib:x64-windows
          vcpkg integrate install

      - name: Build with Warnings as Errors
        run: msbuild XL++.sln /p:Configuration=Release /p:Platform=x64 /p:TreatWarningAsError=true /m /verbosity:normal
        continue-on-error: true

  header-check:
    name: Standalone Header Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Configure CMake
        run: cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DXLPP_BUILD_TESTS=ON
          -DXLPP_BUILD_SAMPLES=OFF
          -DXLPP_BUILD_CAPI=OFF

      - name: Build header check
        run: cmake --build build --target XLPP_HeaderCheck

      - name: Build unit tests
        run: cmake --build build --target XLPP_UnitTests

      - name: Run tests
        working-directory: build
        run: ./tests/XLPP_UnitTests || true
