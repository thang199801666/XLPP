name: Build Python wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  binding-tests:
    name: Python binding tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build extension (self-contained)
        run: |
          python -m pip install --upgrade pip pybind11 pytest numpy openpyxl setuptools wheel
          python setup.py build_ext --inplace

      - name: Run binding tests
        working-directory: bindings/python
        run: python -m pytest

  wheels:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel (self-contained)
        run: |
          python -m pip install --upgrade pip build wheel pybind11 setuptools
          python -m build --wheel --no-isolation

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
