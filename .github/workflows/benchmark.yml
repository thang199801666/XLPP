name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: |
          vcpkg install --triplet x64-windows
          python -m pip install --upgrade pip openpyxl xlsxwriter
      - run: msbuild XL++.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal
      - name: Run native tests
        run: .\x64\Release\XLPP.UnitTests.exe
      - name: Build C++ binding and benchmarks
        run: |
          cmake -S . -B build-benchmark -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DXLPP_BUILD_TESTS=OFF -DXLPP_BUILD_SAMPLES=OFF -DXLPP_BUILD_CAPI=OFF `
            -DXLPP_BUILD_BENCHMARKS=ON 2>&1 | Tee-Object cmake-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-benchmark --config Release --target xlpp_external_benchmark --verbose 2>&1 |
            Tee-Object cmake-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Python binding
        run: |
          python -m pip install pybind11 setuptools wheel
          python setup.py build_ext --inplace
      - name: Run benchmarks
        continue-on-error: true
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          $output = New-Object System.Collections.Generic.List[string]
          $cppExecutable = Get-ChildItem -Path .\build-benchmark -Filter xlpp_external_benchmark.exe -Recurse |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -ExpandProperty FullName
          if ($cppExecutable) {
            $output.AddRange([string[]](& $cppExecutable 2>&1 |
              Tee-Object cpp-benchmark.log))
          } else {
            $output.Add("BENCHMARK,c++,XLPP,write,pending,0")
            $output.Add("BENCHMARK,c++,libxlsxwriter,write,pending,0")
          }
          $output.AddRange([string[]](& dotnet run --project benchmarks/csharp/Xlpp.Benchmarks.csproj -c Release 2>&1 |
            Tee-Object csharp-benchmark.log))
          $output.AddRange([string[]](& python benchmarks/benchmark.py 2>&1 |
            Tee-Object python-benchmark.log))
          $output.AddRange([string[]](& python benchmarks/benchmark_extended.py 2>&1 |
            Tee-Object python-extended-benchmark.log))
          $output.AddRange([string[]](& python benchmarks/benchmark_streaming.py 2>&1 |
            Tee-Object python-streaming-benchmark.log))
          $benchmarks = $output | Select-String -Pattern '^BENCHMARK,'
          $benchmarks | ForEach-Object { $_.Line } | Out-File bench-results.txt -Encoding utf8
          $summary = @("## Benchmark Results", "", '```text') +
            @($benchmarks | ForEach-Object { $_.Line }) + @('```')
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Output "--- Benchmark Results ---"
          Get-Content bench-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench-results.txt
            cmake-configure.log
            cmake-build.log
            cpp-benchmark.log
            csharp-benchmark.log
            python-benchmark.log
            python-extended-benchmark.log
            python-streaming-benchmark.log
          if-no-files-found: ignore
