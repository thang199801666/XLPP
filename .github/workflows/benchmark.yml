name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: |
          vcpkg install --triplet x64-windows
          python -m pip install --upgrade pip openpyxl xlsxwriter
      - run: msbuild XL++.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal
      - name: Run native tests
        run: .\x64\Release\XLPP.UnitTests.exe
      - name: Build C++ binding and benchmarks
        run: |
          cmake -S . -B build-benchmark -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DXLPP_BUILD_TESTS=OFF -DXLPP_BUILD_SAMPLES=OFF -DXLPP_BUILD_CAPI=OFF `
            -DXLPP_BUILD_BENCHMARKS=ON
          cmake --build build-benchmark --config Release --target xlpp_external_benchmark
      - name: Build Python binding
        run: |
          python -m pip install pybind11 setuptools wheel
          python setup.py build_ext --inplace
      - name: Run benchmarks
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          $output = New-Object System.Collections.Generic.List[string]
          $output.AddRange([string[]](& .\build-benchmark\Release\xlpp_external_benchmark.exe 2>&1))
          $output.AddRange([string[]](& dotnet run --project benchmarks/csharp/Xlpp.Benchmarks.csproj -c Release 2>&1))
          $output.AddRange([string[]](& python benchmarks/benchmark.py 2>&1))
          $benchmarks = $output | Select-String -Pattern '^BENCHMARK,'
          $benchmarks | ForEach-Object { $_.Line } | Out-File bench-results.txt -Encoding utf8
          Write-Output "--- Benchmark Results ---"
          Get-Content bench-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
