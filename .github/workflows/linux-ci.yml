name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            build_type: Debug
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            build_type: Release
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            build_type: Release
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get install -y g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      - name: Install Clang 18
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DXLPP_USE_BUNDLED_ZLIB=OFF

      - name: Verify public headers
        run: |
          printf '#include <XLPP/Cell/CellReference.h>\nint main() { return static_cast<int>(xlpp::makeCellKey(1, 1)); }\n' > /tmp/header-check.cpp
          ${{ matrix.cxx }} -std=c++20 -Iinclude -fsyntax-only /tmp/header-check.cpp

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C ${{ matrix.build_type }}

  sanitizers:
    name: ASan + UBSan (Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DXLPP_USE_BUNDLED_ZLIB=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan

      - name: Test
        working-directory: build-asan
        run: |
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1
          # PackageConsumerTests links the ASan-instrumented library into a
          # plain consumer, which fails at link time; it runs in the normal
          # build-and-test and install-package jobs instead.
          ctest --output-on-failure -E PackageConsumerTests

  coverage:
    name: Coverage (gcov/lcov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev g++-14 lcov
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      - name: Configure with coverage flags
        run: |
          cmake -S . -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DXLPP_BUILD_SAMPLES=OFF \
            -DXLPP_BUILD_CAPI=OFF \
            -DXLPP_USE_BUNDLED_ZLIB=ON \
            -DCMAKE_C_FLAGS="--coverage -g -O0" \
            -DCMAKE_CXX_FLAGS="--coverage -g -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build-cov

      - name: Run unit tests
        working-directory: build-cov
        run: ctest --output-on-failure -R XLPP_UnitTests

      - name: Capture coverage
        run: |
          lcov --capture --directory build-cov --output-file coverage.info \
            --rc lcov_branch_coverage=1 --ignore-errors mismatch,gcov
          lcov --remove coverage.info --output-file coverage-filtered.info \
            '*/third_party/*' '*/tests/*' '/usr/*' \
            --rc lcov_branch_coverage=1 --ignore-errors mismatch
          genhtml coverage-filtered.info --output-directory coverage-html \
            --rc lcov_branch_coverage=1 --branch-coverage

      - name: Print coverage summary
        run: lcov --summary coverage-filtered.info --rc lcov_branch_coverage=1

      - name: Enforce line-coverage threshold
        run: |
          LINE=$(lcov --summary coverage-filtered.info --rc lcov_branch_coverage=1 2>&1 \
            | grep 'lines......:' | awk '{print $2}' | tr -d '%')
          echo "Library line coverage: ${LINE}%"
          awk -v line="$LINE" -v thr="50" 'BEGIN { if (line + 0 < thr + 0) { print "Coverage below threshold"; exit 1 } }'

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html

  install-package:
    name: Install & consumer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DXLPP_USE_BUNDLED_ZLIB=OFF \
            -DXLPP_BUILD_TESTS=OFF \
            -DXLPP_BUILD_SAMPLES=OFF \
            -DXLPP_BUILD_CAPI=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/xlpp-install
          cmake --build build
          cmake --install build

      - name: Consumer compiles against installed package
        run: |
          cmake -S tests/package/consumer -B /tmp/xlpp-consumer-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/xlpp-install
          cmake --build /tmp/xlpp-consumer-build --target run_consumer
          test -f /tmp/xlpp-consumer-build/consumer_app

      - name: Consumer via add_subdirectory
        run: |
          cmake -S tests/package/consumer_subdir -B /tmp/xlpp-subdir-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXLPP_SOURCE_DIR=${PWD}
          cmake --build /tmp/xlpp-subdir-build --target run_subdir_app

  python-wheel:
    name: Python wheel (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 zlib1g-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          python -m pip install --upgrade pip build wheel pybind11 setuptools

      - name: Build native libraries
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DXLPP_BUILD_TESTS=OFF \
            -DXLPP_BUILD_SAMPLES=OFF \
            -DXLPP_BUILD_CAPI=OFF \
            -DXLPP_USE_BUNDLED_ZLIB=ON
          cmake --build build
          mkdir -p x64/Release
          cp build/src/libxlpp_static.a x64/Release/
          zlib_archive=$(find build -type f \( -name 'libz.a' -o -name 'libzlibstatic.a' \) -print -quit)
          test -n "$zlib_archive"
          cp "$zlib_archive" x64/Release/libzlibstatic.a
          test -f x64/Release/libxlpp_static.a
          test -f x64/Release/libzlibstatic.a

      - name: Build wheel
        working-directory: bindings/python
        run: python -m build --wheel --no-isolation

      - name: Test wheel
        run: |
          python -m venv --copies wheel-test
          wheel-test/bin/python -m pip install --upgrade pip
          wheel-test/bin/python -m pip install bindings/python/dist/*.whl
          wheel-test/bin/python -c "import xlpp; wb=xlpp.Workbook(); ws=wb.add_worksheet('CI'); ws['A1'].value=42; print('Python binding OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: xlpp-linux-wheel-py${{ matrix.python-version }}
          path: bindings/python/dist/*.whl
