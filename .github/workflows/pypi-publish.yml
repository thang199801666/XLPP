name: Python Wheels
# Publishes xlpp wheels to PyPI when a GitHub Release is published.
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip cibuildwheel==2.*
      - run: python -m cibuildwheel . --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with: { name: wheels-${{ matrix.os }}, path: wheelhouse/*.whl }
  publish:
    if: github.event_name == 'release'
    needs: wheels
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: wheels-*, merge-multiple: true, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist }
