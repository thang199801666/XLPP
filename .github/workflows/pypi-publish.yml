name: Python Wheels
# Publishes xlpp wheels to PyPI.
#   - GitHub Release (v*)  -> publish to PyPI (Trusted Publishing).
#   - workflow_dispatch    -> choose testpypi or pypi.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Package index'
        required: true
        default: pypi
        type: choice
        options:
          - testpypi
          - pypi
  release:
    types: [published]
jobs:
  wheels:
    env:
      # Fast first release: one widely used CPython ABI per platform.
      # Restore cp310/cp311/cp313 in the full release workflow after this
      # wheel has been validated on PyPI.
      CIBW_BUILD: cp312-*
      CIBW_ARCHS_LINUX: x86_64
      CIBW_BUILD_VERBOSITY: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip cibuildwheel==2.*
      - run: python -m cibuildwheel . --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
