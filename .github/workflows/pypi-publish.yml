name: Publish to PyPI

# Publishes xlpp wheels + sdist to PyPI.
#   - Tags v*          -> publish to PyPI (requires a Trusted Publisher
#                         configured for this repo in PyPI's settings).
#   - workflow_dispatch-> publish to TestPyPI.
#
# The wheel build is fully self-contained: setup.py compiles the XL++ library,
# the bundled zlib and the pybind11 binding directly, so no pre-built native
# libraries are needed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build setuptools wheel pybind11
          python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish
    needs: [wheels, sdist]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/xlpp' || 'https://test.pypi.org/project/xlpp' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p dist-flat
          find dist -name '*.whl' -o -name '*.tar.gz' | while read -r f; do cp "$f" dist-flat/; done
          ls -la dist-flat

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-flat
          repository-url: https://test.pypi.org/legacy/
          # Allow re-runs of the same tag to add new wheels without failing on
          # files that were already uploaded in a previous run.
          skip-existing: true

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-flat
          skip-existing: true
