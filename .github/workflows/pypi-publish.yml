name: Publish to PyPI

# Publishes xlpp wheels + sdist to PyPI.
#   - Tags v*          -> publish to PyPI (requires a Trusted Publisher
#                         configured for this repo in PyPI's settings).
#   - workflow_dispatch-> publish to TestPyPI.
#
# The wheel build is fully self-contained: setup.py compiles the XL++ library,
# the bundled zlib and the pybind11 binding directly, so no pre-built native
# libraries are needed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Package index for a manual publish'
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        shell: bash
        run: |
          python scripts/check-version.py
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1

      - name: Verify wheel metadata
        shell: bash
        run: |
          python -m pip install --upgrade packaging
          python -c "import pathlib, zipfile; from packaging.version import Version; expected=Version(pathlib.Path('VERSION').read_text().strip()); wheels=list(pathlib.Path('wheelhouse').glob('*.whl')); assert wheels, 'No wheels built'; versions=[]; [versions.append(Version(zf.read(next(n for n in zf.namelist() if n.endswith('.dist-info/METADATA'))).decode().split('Version: ', 1)[1].splitlines()[0])) for w in wheels for zf in [zipfile.ZipFile(w)]]; assert all(v == expected for v in versions), (versions, expected)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build setuptools wheel pybind11
          python -m build --sdist --outdir dist
          python -m pip install --upgrade packaging
          python -c "import pathlib, tarfile; from packaging.version import Version; expected=Version(pathlib.Path('VERSION').read_text().strip()); archive=next(pathlib.Path('dist').glob('*.tar.gz')); members=tarfile.open(archive).getnames(); setup=next(m for m in members if m.endswith('/PKG-INFO')); data=tarfile.open(archive).extractfile(setup).read().decode(); actual=Version(next(line.split(': ',1)[1] for line in data.splitlines() if line.startswith('Version: '))); assert actual == expected, (actual, expected)"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish
    needs: [wheels, sdist]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || inputs.repository }}
      url: ${{ (github.event_name == 'push' || inputs.repository == 'pypi') && 'https://pypi.org/p/xlpp' || 'https://test.pypi.org/project/xlpp' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p dist-flat
          find dist -name '*.whl' -o -name '*.tar.gz' | while read -r f; do cp "$f" dist-flat/; done
          ls -la dist-flat

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-flat
          repository-url: https://test.pypi.org/legacy/
          # Allow re-runs of the same tag to add new wheels without failing on
          # files that were already uploaded in a previous run.
          skip-existing: true

      - name: Publish to PyPI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-flat
          skip-existing: true
